    <h3>太空杀</h3>
    <p>《太空杀》是一款多人社交推理手游，游戏支持4至15位玩家一起玩，内置太空狼人杀、大逃杀、躲猫猫等玩法。游戏将场景设计在宇宙飞船或空间站内进行，玩家被分为不同阵营，主线任务是修复飞船上的各类设施，船员阵营要完成一系列解谜任务，破坏者阵营则密谋破坏，在一步步悬疑、推理中尽享游戏乐趣。</p>
