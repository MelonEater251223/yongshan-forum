### 前序 ###
<p>如你所见，这是《雾里寻情》的前序。其实原先写这本“书”的目的是回忆和记录我喜欢过的人的。那时还是七年级下学期，临近520，一群人跟我开玩笑说要不要给茅瑶函写情书。这件事我还真去认真考虑了一下，想到干了还是白干，就找了个借口——等八年级时的520再说！然而，等到八年级的520时，我已经跟茅瑶函“恢复外交关系”，这事自然不可能再做。于是乎，到此为止。</p>
<p>“考虑”其实是真考虑，我也想过要怎么写的，写过一稿，不过没用上，扔哪——我也不知道。说回《雾里寻情》的由来。它的诞生正是在这样一个奇怪的背景之下。最初写的时候内容并不是很长，只讲了重点，一人只叙述一件事（初中生涯都还没过完一半），比如当时写胡某，就讲胡某让我帮忙解除屏幕冻结这事（详见正文）；有些根本不记事，因为没事可以记录。造成这样的原因有一点就是没写日记，后来我就开始狂写日记。但等我引用时又觉得自己当初怎么写得这么“糖”，只好一改再改，然后直接重写。那时的《雾里寻情》就经过了十几次更改，后面才是非常稳定地“大改”一次。</p>
<p>八年级圣诞节前后，我的同桌是曾硕，他对《雾里寻情》有着极大的兴趣。时至八年级，但那篇(因为七年级刚写时真的只能算一篇文章)还没有新的内容。在他的支持下，我开始了第一次“大改”，并有了一个很新颖的想法：不局限于写我一人的经历。于是，七年级老“海王”谢某和八年级“新兴”“海王”林某被纳入书中。一直到来年清明节，我完成了第一版“大集合”</p>
<p>《雾里寻情》主要是“海王”们的故事，最初我想写《雾里寻情2》来讲述其它“恋情”，但后面计划被搁置。520时，我又进行了一次修改，此后又有一些小的语病、内容错误的更改，最终完稿。</p>
<p>显然，九年级即将过去，又一个520的到来是再次重写的信号。而且我可以充分相信，这部反应“情感”的书还将能反应这个班三年来的历史，不妨可以当一部史书来看。</p>
<p>即便带有很强的作者主观意向。</p>
<p>比如黄某昊。当然，此物种在班内男生中都不受待见，至于女生，我不清楚。这是它的事，不是我的事。</p>
<p>这一次最大的改动在哪呢？其一是叙述视角的问题，在之前的版本中，我都是使用第一人称，以“我”叙述故事。这在看“杨利伟”篇和看“谢明佑”“林羽凡”篇时的感受大不相同，一个是自述，另二个是转述，哪都不对，这次统一采用上帝视角，舒服多了（当然，我是头一次这样写，有问题请指出，多谢！）。其二是内容的问题，故事肯定会比之前更加全面，而且我把以前《雾里寻情2》的草案加入到里面，不能说全都有，至少更多了。</p>
<p>虽然我的某些股东可能会因为他的名字出现在书中而生气撤资……</p>
<p>就到此为止了，愿新的年级不要有那么多烦心事。</p>
<p style="text-align:right;">杨利伟<br><u>2026.6.9</u></p>

### 第一章：青春悸动 ###
<p>曾硕曾有一句名言：“唉！杨利伟，一个活生生把自己活成乐子的人！”这句话在八年级时说了上千遍，乐此不疲。很多时候，我们并不能很好理解一件事，包括这件。到底是何人能让曾硕如此感慨？这个与航天员同名的人内心深处有什么样的秘密？</p>
<p>阴雨蒙蒙，东侧教室，七年(3)班，人潮涌动，空气中弥漫着奇怪的味道。不为别的，开学罢了。</p>
<p>班级里许多同学都参加过夏令营，在开学前几天也都来过学校见过面，所以是相当熟的。对于杨利伟而言，最大的问题是先找到一个空位。于是他坐了下来。过了几分钟，有一个同学在门口站着，班主任问他怎么了。</p>
<p>“我的座位被占了。”</p>
<p>这是一个相当尴尬的情况，班主任顺着他的目光看去，杨利伟就坐在那里。班主任只好让杨利伟暂且坐在最后面，这样，一个棘手的问题就解决了。</p>
<p>“陈嘉豪……这名字有点意思。”在嘉豪梗尚未出现之前，这个名字并不算有什么特殊含义，打顶也就是因为“嘉豪”这个名字比较出众吧。不过叫作“嘉豪”的人确实多多少少有些本事。嘉豪，是杨利伟的第一个同桌，兴许也是时间最短的一个同桌，很快班主任就要开始微操了。</p>
<p>两年之后，陈嘉豪会成为杨利伟心里恐惧的来源，数学。</p>
<p>班主任开始调座位了。原来的二人桌被拼成了三人桌。很遗憾的是，陈嘉豪被挪到了唐家杰、谢明佑那边，杨利伟只好从右边获取一个新同桌。不过他倒无所谓，依他所言，虽然都不认识，但只要坐上几天，生米饭也能变熟米饭。</p>
<p>于是，送走陈嘉豪后，杨利伟迎来了一个新的同桌——李雨晴，是个女生。</p>
<p>“雨晴”也是一个常见的名字。</p>
<p>这很为难杨利伟，因为他也是第一天才来，可不像大多数人还参加过夏令营，人生地不熟，刚认识一个没几小时就走了，还来一个女同学，实在令人难办。不过确实如他自己所言，没过几天，他们就熟了，因为李雨晴经常找他借改正带。</p>
<p>最强海王生涯（也许是的话）就此开始。</p>
<p>严格意义上来说，杨利伟或许对李雨晴并没有特别心动，只是因为有那么一点。不过他本人对此并不这么认为。他认为既然有那种感觉，就应该算作“喜欢”。如果按照这样的定义的话，恐怕这一辈子都写不完了。因为这一点，他也遭到了许多人抨击，不得不在两年多后强行备注“严格意义上不算入喜欢的人”，但最后排除这些“严格意义上不算入喜欢的人”，还是有4个。</p>
<p>所以，快进一下吧。</p>
<p>很快，杨利伟第一次真正“喜欢”（按照他的定义）的人，被他喜欢了，她的名字叫作林佳馨。</p>
<p>“佳馨”，是个跟“嘉豪”并列的名字，换句话说，也是一个大众化的名字。看得出来，杨利伟多多少少有一点奇怪的运气。</p>
<p>杨利伟没有说过自己到底为什么喜欢别人，也许是因为本来就没有理由，也许是因为他忘了，总之，在两年之后的九年级，即使同学知道他喜欢的人，也仍不知道是何原因，每当人们问起，他总说：“时间太久了，有点忘了。”然后“过去的就让它过去吧”。</p>
<p>确切时间并不可考，但是大致是在刚开学两个月后，也就是大约11月份。</p>
<p>11月份，有两个比较特殊的事件——研学和运动会。</p>
<p>研学在这里并不重要，但运动会所能得到的信息就多了。</p>
<p>七年级时，这一届运动会并不是在研学之后直接开始的，而是拖了一会儿。运动会期间，由于一些人不喜欢看他们比赛，于是待在教室里。可是待在教室里又没什么事情可做，就有人提议玩单词接龙，此举得到了大家的赞同，他们便在黑板上玩了起来，其中有个人是英语课代表（当时）——不用说你也知道——肯定就是——林佳馨。</p>
<p>运动会第二天中午，女生有人带了一副扑克牌，杨利伟便和她们躲在教室图书角处打了起来。不用说——其中肯定也有林佳馨。可以说，这两件事极大加强了杨利伟对林佳馨的感情。</p>
<p>与此同时他还“喜欢”（同李雨晴）一个人，叫作林函颖，不过时间极短。或许可以说他一点都不专注，因为他还喜欢（同林佳馨）一个人，叫作茅瑶函。因为这件事，他折腾了三年。</p>
<p>话说回来，运动会时，杨利伟和他的一群“基友”一起玩真心话大冒险，经过多轮后，很遗憾，杨利伟输了。</p>
<p>“那就真心话吧。”</p>
<p>在此说明一下，当天玩真心话的人为杨利伟、范雨泓、伍昊睿、黄渝昊四个人（姑且算最后一个是人）。当别人问及“你喜欢的人是谁”时，杨利伟犹豫了几秒，答道：</p>
<p>“林佳馨。”</p>
<p>“你们别说出去啊！”</p>
<p>“肯定不会啊！”他们异口同声回道。</p>

### 第二章：走马灯般的感情 ###
<p>一个月不到，范雨泓突然跟杨利伟说了句话：“别人知道你喜欢林佳馨了。”杨利伟吃惊地盯着范雨泓，手里的鸡腿还没啃完。他实在想不到居然真的会传出去。在场哪个人有嫌疑呢？范雨泓吗？不对，如果是他说的他就不会来找我。伍昊睿吗？他这么老实，不可能吧？总不能是黄渝昊吧？可是有个共同关注的博主“阿秋”，志同道合总不能背刺一刀吧？</p>
<p>真开揭开还需要很久，这里不说。</p>
<p>在这次风波之后，杨利伟平静了一段时间，虽然还是有严煜皓调侃和拉着杨利伟追着林佳馨跑的奇异行为，但杨利伟知道，林佳馨有喜欢的人，不是他。一个学期就这样过去了。</p>
<p>七年级下学期，惊天地，泣鬼神，史上最大最逆天八卦（或许是）——杨利伟喜欢茅瑶函——登场！</p>
<p>之所以说是最大，主要是因为别班也知道……就这一点，够了。</p>
<p>之所以说是最逆天，是因为这是最不可能的两个人，《挑战不可能》都不敢挑战这个。在其他人看来，一个是没啥能力的生物，一个是班级前几，这合理吗？</p>
<p>事情的起因来自于返校考后的一个周末：当天下午英语考完后，老师通知第二天不上课，但是杨利伟并没有听到，于是在晚自习结束后，他回了宿舍才发现大家早已走完，仅剩一个王俊煌留下。杨利伟此时才懊悔为何不回家。第二天早上，王俊煌起得很早，留下杨利伟一人先走了；半小时后杨利伟起床，发现王俊煌不在，于是买了早餐就去教室。正当他以为只剩他一人时，茅瑶函推门而入，那一瞬间，杨利伟心跳突然加快，随后又平静下来。</p>
<p>茅瑶函要是知道她有可能面临什么的话，她打死都不会留宿的（记住，这是原话）。</p>
<p>因为杨利伟的脑中有了一个疯狂的想法。</p>
<p>这就要人命了。好在最后还是理智战胜了欲望，杨利伟并没有实施，但很显然，他没有管好他的嘴，接下来的一年半，这是一个痛苦的过程。</p>
<p>当茅瑶函知道此事时，已经一个月过去了，她很愤怒。最后造就的结果是，虽然同样是喜欢别人被人知道，但你曾可见过有人拉着杨利伟追茅瑶函跑吗？</p>
<p>茅瑶函只想躲得很远，远离这个人。而杨利伟在知道茅瑶函的想法后，也宁愿离得远些，企图一个安宁。</p>
<p>在返校考后周六这一事件之后，林佳馨就渐渐从杨利伟脑海中淡忘了。但是，一个人的心如果不能安定下来，最后还是要归于“心动”的。显然，杨利伟忘掉林佳馨、“拥抱”茅瑶函时，他又盯上了一个人——语文课代表——胡清雪。</p>
<p>好在，此时胡清雪尚不知情。</p>
<p>当然，她知情也没花太长时间。</p>
<p>胡清雪并没有比较特别的地方，论成绩自然比不过茅瑶函——甚至不如杨利伟，但她学过舞蹈，曾经七年级时运动会的美食节上表演过。但如果说这是杨利伟喜欢胡清雪的理由又未免太生硬了——差如此之久？</p>
<p>很显然不是这个原因。</p>
<p>按班内某些人提供资料，在传闻中杨利伟喜欢胡清雪前有一件事与他们俩有关：那一次是一个晚自习，身为语文课代表的胡清雪在给大家对《骆驼祥子》的校本答案。许承益订正（或许是直接抄）比较慢，于是冻结屏幕拿走了答案原稿。但是当胡清雪要解除屏幕冻结时却不知道要怎么做，于是去讲台边“随便”找了一个人——不用说是谁——去解除。当他回到座位时，严煜皓说道：“居家好男人啊！”</p>
<p>虽然故事很扯，但确实是最接近的了。至今杨利伟不明白为什么胡清雪不叫更近的严煜皓。</p>
<p>在八年级之前，胡清雪大概率是不知道的。</p>
<p>所以，七年级过去了，八年级到来了。</p>
<p>对于杨利伟喜欢别人的事天天被爆出去这件事，是不是同一个人干的，做这样的事情的意义，这里不做探讨，至少说到此处位置，并没有人能够说明什么。如果说非要有一个怀疑对象的话，杨利伟或许会认为是黄渝昊，一个是另外二人无作案动机（虽然黄渝昊也没有），另一个是他和班里女生玩得很好。但是在八年级下学期之前，讨论这个问题是完全无用的。所以回到正文。</p>
<p>八年级开始的一个月并没有什么特别有意思的事情，一直到11月份，事情有了一些诡异。</p>
<p>11月份，研学和运动会。</p>
<p>这次研学其实很值得一提，虽然没有什么故事，但当时男生队伍其中一个领头的人，是杨利伟；而女生中的其中一个领头的人，是胡清雪。这是个大问题，每次集合时杨利伟总是不自觉往左瞄一眼——有时不止一眼，大大影响了他的眼位（他刚在七年级暑假做了斜视纠正手术）。</p>
<p>研学回来之后召开了期中考家长会。家长会结束后，时间还早，几个人便玩起了狼人杀，但是人数又不够，胡清雪就盯上了在一旁写日记的杨利伟。</p>

### 第三章：最后一次 ###
<p>是的，胡清雪想要让杨利伟加入这场对局。</p>
<p>按常理来说，要是自己喜欢的人邀请自己一起玩的话，估计内心早就“暗爽”了；但不知道那天是怎么的，或许是杨利伟哪根筋搭错了，竟然回绝了胡清雪的邀请，表示自己“正在写日记”，但胡清雪（那时已经知道杨利伟喜欢她了）为了使他妥协，直接学习杨芯怡（八上的时候，杨芯怡喜欢看杨利伟日记，但很多时候他都不借，于是杨芯怡就直接抢走）抢走了杨利伟的日记。这下就难办了，杨利伟被迫加入。对他而言唯一好的地方在于身份是裁判在耳边说的，而裁判正是那位“抢劫者”！自行细品，喜欢的人在耳边说话……</p>
<p>拿回他的日记后，杨利伟在当天日记里写下一段话：为了让我陪你们玩狼人杀，硬生生学杨芯怡抢走我日记，过分至极。别再抢日记啦！</p>
<p>气愤是有的，但气愤中是否有些欣喜呢？无从可循。</p>
<p>再往下几天，11月30日，这个故事的高潮即将来临——因为接下来这个人，不仅是杨利伟最后“真正动了心”的人，而且还让喜欢时间最长及第二长的茅瑶函和胡清雪被杨利伟从大脑中所抛弃，哪怕她在他心中的地位远不及茅瑶函和胡清雪——张墅丽。</p>
<p>其实张墅丽并非一开始就是3班的学生，而是在七下期中考成绩优异从11班调上来的。她是一个相当开朗、乐观的女生。不过刚转入3班时，张墅丽并没有在杨利伟心中留下什么特别多的印象，除了一次来得比较早帮她找地理顶尖以外，七年级几乎可以说是“完全”没有交集。但八年级不一样，因为11月30日，这是一个周六。</p>
<p>如果你还记得的话，或许会想起来，曾经也有一个周六，改变了两个人的轨迹——杨利伟与茅瑶函单独在教室那一天。</p>
<p>好在11月30日这天没有当初那般“腥风血雨”，反而是一种相当友好的局面。由于杨利伟要等他姐姐放学再走，所以留了一个下午，而同样张墅丽也在等她的家长——缘分啊！</p>
<p>在那次之后，每周六他们两个人都会留下，一起聊聊天，比如班级里谁谁谁又喜欢谁谁谁（当然不是在讲他自己），关系相当好，但杨利伟的内心却越来越躁动，他知道这可能的结果是什么——强行中断友谊，就像和茅瑶函，“相见不相识”。对于张墅丽而言，她并非不知道杨利伟有喜欢别人的经历，只是因为恰好她知道他喜欢茅瑶函，或许她会认为杨利伟不会很随意地喜欢别人，但她赌错了，他的下一个目标，正是她自己！</p>
<p>不过，，在她知晓前，他们仍然可以交谈甚欢。张墅丽敢直接找杨利伟要牛奶，而杨利伟自然毫不犹豫给了她，让曾硕发出了“宁可给‘女朋友’也不给我”的感叹。元旦前一天，他们再一次留下，由于张墅丽牙不好，就把自己的几颗糖给了杨利伟。这就不得不令人怀疑一下动机了。</p>
<p>这一切结束在2月25日。确切来说，应该是指前一天晚上。</p>
<p>憋了这么久，是时候讨论下“泄密”这个问题了。之前提到过，在当时杨利伟猜想最有可能的人是黄渝昊，但又没有直接证据，仅仅只能是“怀疑”。然而，接下来这件事几乎让他笃定：一定是黄渝昊。</p>
<p>这天晚上，男生宿舍全都回到了宿舍。偶然间，有人提到了现在杨利伟喜欢的人。在此之前，除了严煜皓发现以外，并没有其他人知道杨利伟喜欢张墅丽一事。而严煜皓即便在这件事公开后也没有大肆宣传此事。当有人提出这个问题时，黄渝昊首先向杨利伟开始“盘问”，杨利伟本着拒不回答“如何呢？又能怎？”的精神与其对峙，然而黄渝昊却步步紧逼。在黄渝昊再一次问出这个问题时，杨利伟的心里防线彻底被攻破。</p>
<p>“我现在喜欢张墅丽行了吧！”杨利伟抱着枕头，几乎快哭出来，“你满意了吧？！”</p>
<p>“我求你们，能不能不要说出去啊？”</p>
<p>“没事，我们不会说的。”邹少政回道。</p>
<p>宿舍很安静，寂静得可怕。</p>
<p>当第二天杨利伟得知张墅丽已经知道这件事后，他再一次暴怒了：“不是说好的不会说出去吗？谁又说出去了？——黄渝昊，是不是你？”黄渝昊辩解道：“我怎么可能说出去？你看我像会说的吗？”“我看你像。”“有本事拿证据说话。”</p>
<p>这场闹剧到此结束。</p>
<p>很显然，这件事直接导致了杨利伟和张墅丽之间友好关系的破裂；事实上，他们在几天前才刚加上微信。张墅丽患流感发烧时，杨利伟还关心她的情况，并预祝“希望赶紧好起来”。黄渝昊自然知道他们互加微信，便问张墅丽是否会拉黑或删掉杨利伟，她回了一句话：</p>
<p>“我不会删的。”</p>

---
### 第四章 ###
<p>事实上，的确是黄渝昊说的；最重要的是，它不是第一次这么做，“七上八下”，它一直是传播者。</p>
<p>虽然彻底揭开谜底还要等到九年级时，但现在可以先公布结果，至于如何揭晓，且看下文分解，现在先回来。</p>
<p>张墅丽当然遵守了她的诺言，没有拉黑或直接删掉杨利伟，但也采取了冷淡的处理方法——往差了说，也只是算没有茅瑶函那么彻底的隔离。按鲁迅的说法是：“我们之间已经隔了一层可悲的厚障壁了。”这种奇怪的状态一直维持着，很难让人明白到底是远离还是亲近，即使九年级也是如此。</p>
<p>所以对于杨利伟而言，现在最重要的是打破这层隔阂。</p>
<p>比较恰巧的是，还偏偏让他碰上这样的机遇——只是代价有点大，而且跟张墅丽无关。</p>
<p>这件事情来源于一次在班级中玩多媒体。这似乎是一个(3)班基因中默认的程序。，即使到了九年级，(11)班仍然有玩多媒体的习惯。这一次其实很不同，因为在场全是寄宿生——这是个周六，而且还是3月1日；杨利伟和茅瑶函单独待的那天，是3月2日。</p>
<p>话说八年(3)班寄宿生们在开party，但是走的时候忘了关门。大家都知道周六九年级自习，但是九年级经常来“光顾”，这门没关可真是要了命。当张墅丽返回教室时，刚好看到两个九年级学生在教室中翻找。为了避免不必要的麻烦，张墅丽第一时间去联系班主任。</p>
<p>于是班主任就开始查监控，从下午一直倒放到早上，于是就被发现了。</p>
